<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>NANOFES GAIT</title>

  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">

  <style>
    :root {
      --bg: #000000;
      --border: #00384f;
      --grey: #808080;
      --purple: #7030a0;
      --blue: #2028ff;
      --red: #ff1010;
      --green: #00b050;
      --white: #ffffff;
      --status: #1b1b1b;
    }

    * {
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      margin: 0;
      min-height: 100vh;
      background: var(--bg);
      color: var(--white);
      font-family: Arial, sans-serif;
      display: flex;
      justify-content: center;
      align-items: center;
      user-select: none;
      touch-action: manipulation;
      overflow: hidden;
    }

    .app {
      width: min(100vw, 720px);
      height: min(100vh, 960px);
      padding: 4vh 5vw;
      display: grid;
      grid-template-rows:
        1.65fr
        1fr
        1fr
        1fr
        1fr
        0.35fr;
      gap: 3.2vh;
      background: #000000;
    }

    .big-button,
    .info-box,
    .bottom-button,
    .status-box {
      border: 3px solid var(--border);
      border-radius: 28px;
      color: var(--white);
      font-weight: 400;
      text-align: center;
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: none;
    }

    .info-box {
      background: var(--grey);
      flex-direction: column;
      gap: 4vh;
      font-size: clamp(24px, 4.5vw, 38px);
      line-height: 1.25;
      padding: 16px;
    }

    .connect-button {
      background: var(--purple);
      font-size: clamp(24px, 4.5vw, 38px);
    }

    .test-blue {
      background: var(--blue);
      font-size: clamp(24px, 4.5vw, 38px);
    }

    .test-red {
      background: var(--red);
      font-size: clamp(24px, 4.5vw, 38px);
    }

    .test-blue.on,
    .test-red.on {
      outline: 5px solid white;
      filter: brightness(1.2);
    }

    .bottom-row {
      display: grid;
      grid-template-columns: 1fr 1.15fr 1fr;
      gap: 3.2vw;
    }

    .bottom-button {
      font-size: clamp(22px, 4.2vw, 36px);
      line-height: 1.15;
      padding: 8px;
    }

    .bottom-button.green {
      background: var(--green);
    }

    .bottom-button.stop {
      background: var(--red);
    }

    .bottom-button.active {
      outline: 5px solid white;
      filter: brightness(1.1);
    }

    .status-box {
      background: var(--status);
      font-size: clamp(12px, 2.4vw, 18px);
      padding: 6px 12px;
      color: #d0d0d0;
      overflow: hidden;
      white-space: nowrap;
      text-overflow: ellipsis;
    }

    button {
      border: none;
      cursor: pointer;
      touch-action: none;
      font-family: Arial, sans-serif;
    }

    button:active {
      transform: scale(0.985);
    }

    @media (orientation: landscape) {
      .app {
        width: min(65vw, 720px);
        height: min(100vh, 960px);
        padding: 3vh 3vw;
        gap: 2.3vh;
      }

      .info-box {
        gap: 2.5vh;
      }
    }
  </style>
</head>

<body>
  <div class="app">
    <div class="info-box">
      <div>FES to assist gait (drop-foot)</div>
      <div>Inventor: Leonardo Boccuni</div>
    </div>

    <button id="connectBtn" class="big-button connect-button" onclick="connectBluetooth()">
      Connect to NANOFES_GAIT
    </button>

    <button
      id="blueTestBtn"
      class="big-button test-blue"
      onpointerdown="testRelay(event, 1, true)"
      onpointerup="testRelay(event, 1, false)"
      onpointerleave="testRelay(event, 1, false)"
      onpointercancel="testRelay(event, 1, false)"
    >
      TEST Channel 1 (Blue)
    </button>

    <button
      id="redTestBtn"
      class="big-button test-red"
      onpointerdown="testRelay(event, 2, true)"
      onpointerup="testRelay(event, 2, false)"
      onpointerleave="testRelay(event, 2, false)"
      onpointercancel="testRelay(event, 2, false)"
    >
      TEST Channel 2 (Red)
    </button>

    <div class="bottom-row">
      <button id="leftBtn" class="bottom-button green" onclick="setWorkingLeg('LEFT')">
        LEFT<br>LEG
      </button>

      <button id="stopBtn" class="bottom-button stop active" onclick="stopSystem()">
        STOP
      </button>

      <button id="rightBtn" class="bottom-button green" onclick="setWorkingLeg('RIGHT')">
        RIGHT<br>LEG
      </button>
    </div>

    <div id="statusBox" class="status-box">
      Status: not connected
    </div>
  </div>

  <script>
    const SERVICE_UUID = "19b10000-e8f2-537e-4f6c-d104768a1214";
    const COMMAND_UUID = "19b10010-e8f2-537e-4f6c-d104768a1214";
    const STATUS_UUID  = "19b10011-e8f2-537e-4f6c-d104768a1214";

    let device = null;
    let commandCharacteristic = null;
    let statusCharacteristic = null;
    let connected = false;

    let currentMode = "STOP";
    let test1Active = false;
    let test2Active = false;

    const statusBox = document.getElementById("statusBox");
    const connectBtn = document.getElementById("connectBtn");
    const blueTestBtn = document.getElementById("blueTestBtn");
    const redTestBtn = document.getElementById("redTestBtn");
    const leftBtn = document.getElementById("leftBtn");
    const stopBtn = document.getElementById("stopBtn");
    const rightBtn = document.getElementById("rightBtn");

    function setStatus(text) {
      statusBox.innerText = "Status: " + text;
      console.log(text);
    }

    function updateUi() {
      leftBtn.classList.toggle("active", currentMode === "LEFT");
      rightBtn.classList.toggle("active", currentMode === "RIGHT");
      stopBtn.classList.toggle("active", currentMode === "STOP");

      blueTestBtn.classList.toggle("on", test1Active);
      redTestBtn.classList.toggle("on", test2Active);

      const testingAllowed = currentMode === "STOP";

      blueTestBtn.disabled = !testingAllowed || !connected;
      redTestBtn.disabled = !testingAllowed || !connected;

      if (!connected) {
        connectBtn.innerText = "Connect to NANOFES_GAIT";
      } else {
        connectBtn.innerText = "Connected to NANOFES_GAIT";
      }
    }

    async function connectBluetooth() {
      try {
        setStatus("requesting device...");

        device = await navigator.bluetooth.requestDevice({
          filters: [
            { name: "NANOFES_GAIT" }
          ],
          optionalServices: [SERVICE_UUID]
        });

        device.addEventListener("gattserverdisconnected", onDisconnected);

        setStatus("connecting...");

        const server = await device.gatt.connect();

        setStatus("getting service...");

        const service = await server.getPrimaryService(SERVICE_UUID);

        setStatus("getting command characteristic...");

        commandCharacteristic = await service.getCharacteristic(COMMAND_UUID);

        try {
          statusCharacteristic = await service.getCharacteristic(STATUS_UUID);
          await statusCharacteristic.startNotifications();
          statusCharacteristic.addEventListener(
            "characteristicvaluechanged",
            handleStatusNotification
          );
        } catch (error) {
          console.log("Status notifications unavailable:", error);
        }

        connected = true;
        currentMode = "STOP";
        test1Active = false;
        test2Active = false;

        updateUi();
        setStatus("connected");

        await sendCommand("STOP");
      } catch (error) {
        console.error(error);
        setStatus("error: " + error.message);
      }
    }

    function onDisconnected() {
      connected = false;

      commandCharacteristic = null;
      statusCharacteristic = null;

      test1Active = false;
      test2Active = false;

      /*
        Important:
        The Arduino sketch keeps working after Bluetooth disconnect
        if current mode is LEFT LEG or RIGHT LEG.
        If disconnection happens during TEST, the Arduino sketch cancels TEST.
      */

      updateUi();
      setStatus("disconnected. Nano keeps last working mode unless it was TEST.");
    }

    function handleStatusNotification(event) {
      const decoder = new TextDecoder();
      const value = decoder.decode(event.target.value);
      console.log("STATUS:", value);
      setStatus(value);
    }

    async function sendCommand(command) {
      if (!connected || !commandCharacteristic) {
        setStatus("not connected");
        return false;
      }

      try {
        const encoder = new TextEncoder();
        const data = encoder.encode(command);
        await commandCharacteristic.writeValue(data);
        console.log("CMD:", command);
        return true;
      } catch (error) {
        console.error(error);
        setStatus("write error: " + error.message);
        return false;
      }
    }

    async function testRelay(event, relayNumber, state) {
      event.preventDefault();

      if (!connected) {
        setStatus("not connected");
        return;
      }

      if (currentMode !== "STOP") {
        setStatus("TEST disabled during LEFT/RIGHT gait mode. Press STOP first.");
        return;
      }

      if (relayNumber === 1) {
        if (test1Active === state) return;

        test1Active = state;
        updateUi();

        await sendCommand("TEST RELAY1 " + (state ? "1" : "0"));

        if (state && navigator.vibrate) {
          navigator.vibrate(40);
        }

        return;
      }

      if (relayNumber === 2) {
        if (test2Active === state) return;

        test2Active = state;
        updateUi();

        await sendCommand("TEST RELAY2 " + (state ? "1" : "0"));

        if (state && navigator.vibrate) {
          navigator.vibrate(40);
        }

        return;
      }
    }

    async function setWorkingLeg(leg) {
      if (!connected) {
        setStatus("not connected");
        return;
      }

      test1Active = false;
      test2Active = false;

      currentMode = leg;
      updateUi();

      if (leg === "LEFT") {
        await sendCommand("LEFT LEG");
      } else {
        await sendCommand("RIGHT LEG");
      }

      if (navigator.vibrate) {
        navigator.vibrate([60, 40, 60]);
      }
    }

    async function stopSystem() {
      if (!connected) {
        currentMode = "STOP";
        test1Active = false;
        test2Active = false;
        updateUi();
        setStatus("not connected");
        return;
      }

      currentMode = "STOP";
      test1Active = false;
      test2Active = false;
      updateUi();

      await sendCommand("TEST RELAY1 0");
      await sendCommand("TEST RELAY2 0");
      await sendCommand("STOP");

      if (navigator.vibrate) {
        navigator.vibrate(120);
      }
    }

    window.addEventListener("blur", async () => {
      if (connected && currentMode === "STOP") {
        test1Active = false;
        test2Active = false;
        updateUi();
        await sendCommand("TEST RELAY1 0");
        await sendCommand("TEST RELAY2 0");
      }
    });

    document.addEventListener("visibilitychange", async () => {
      if (document.hidden && connected && currentMode === "STOP") {
        test1Active = false;
        test2Active = false;
        updateUi();
        await sendCommand("TEST RELAY1 0");
        await sendCommand("TEST RELAY2 0");
      }
    });

    updateUi();
  </script>
</body>
</html>
